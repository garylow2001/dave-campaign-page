name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Real values live in repo secrets/variables (never in .env.local on CI).
          # See campaign-plan.md §5 and the README.
          VITE_SHEETS_ENDPOINT: ${{ secrets.VITE_SHEETS_ENDPOINT }}
          VITE_SHEETS_TOKEN: ${{ secrets.VITE_SHEETS_TOKEN }}
          VITE_CALENDLY_URL: ${{ vars.VITE_CALENDLY_URL }}
          VITE_SHOW_INCENTIVE: ${{ vars.VITE_SHOW_INCENTIVE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
