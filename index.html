<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>How your attachment style shapes your money</title>
    <script>
      // GitHub Pages SPA deep-link restore — pairs with public/404.html.
      (function () {
        var target = sessionStorage.getItem("dave-campaign-redirect")
        if (target && target !== location.href) {
          sessionStorage.removeItem("dave-campaign-redirect")
          history.replaceState(null, "", target)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
